name: CI

# Documentation-only commits used to trigger the full ~11-minute job — next
# build, a Chromium download and the Playwright suite — for a typo. Verified
# that no build step, test or fixture reads markdown at runtime. paths-ignore
# only skips when EVERY changed file matches, so any commit that also touches
# code still runs the full gate.
on:
  push:
    branches: [main, "audit/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "MASTERMIND_CONTEXT/**"
      - "LICENSE"
      - "COPYING.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "MASTERMIND_CONTEXT/**"
      - "LICENSE"
      - "COPYING.md"

# Stop paying for runs nobody will read.
#
# Without this, pushing a follow-up commit to a PR leaves the previous run
# going to completion — a full 8.6-minute pipeline (install, tsc, 2622 unit
# tests, validator gate, contract smoke, production build, Playwright on two
# projects) whose result is superseded before it finishes. A PR with three
# review iterations burned four runs to learn one answer.
#
# This repo is private, so those minutes come out of a monthly allowance, and
# CI was ~79% of it: 165 runs at ~8.6 min = ~1,423 of ~1,796 minutes used in
# the first twelve days of August 2026 — enough to exhaust the 2,000-minute
# quota mid-month and have GitHub refuse to start any further job.
#
# Grouping:
#   • pull_request  → keyed by PR number, so a new push cancels the old run.
#   • push (main)   → keyed by SHA, which is unique per commit, so main runs
#     neither cancel each other nor queue behind one another. Every commit
#     that lands still gets verified in full — the point is to drop answers
#     nobody is waiting for, not to skip verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Split 2026-08-26: this used to be one ~9-25 minute job covering everything
# from tsc to Playwright, on both `pull_request` and `push`. That meant every
# PR waited the full pipeline before it could be merged, even though a
# type error or a failing unit test is knowable in under two minutes — the
# slow steps (production build, Playwright install, E2E) were gating on
# fast-failure information they didn't need to.
#
# Now there are two independent jobs, both still triggered by the same
# `on:` block above:
#   • typecheck-and-test — tsc + vitest. This is the one meant to be wired up
#     as a required status check on `main`, so a broken PR is blocked in
#     ~1-2 minutes instead of ~10-25.
#   • build-and-e2e — the previous validator gate / contract smoke /
#     production build / Playwright suite. Still runs on every PR and on
#     every push to main (same coverage as before, nothing dropped) but is
#     NOT required to merge — it's the safety net that catches a broken
#     build or a broken user journey, surfaced quickly rather than silently
#     blocking every merge on Playwright's install step.
#
# Both jobs run in parallel (no `needs:` between them) and each does its own
# checkout + install, so a PR's total CI wall-clock is unchanged — what
# changes is that the merge gate no longer waits on the slower of the two.
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # Healthy run is under 2 minutes. 10 gives headroom without reintroducing
    # the multi-hour wedge risk the old 25-minute ceiling was sized for.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build-and-e2e:
    runs-on: ubuntu-latest
    # A healthy run is ~9-12 minutes. Without this the job inherits GitHub's
    # 6-hour default, and on 2026-08-19 that is exactly what happened: four
    # runs — including main's own post-merge run — sat wedged for 5+ hours
    # each on the Playwright browser install, blocking every merge in the repo
    # and burning roughly 1,200 runner-minutes against the 2,000-minute
    # monthly allowance this workflow's concurrency block was added to protect.
    #
    # 25 gives real headroom over the observed worst case while turning an
    # invisible six-hour wedge into a visible failure you can retry.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deterministic validator gate — 22 known-good/known-bad fixtures, no
      # network, mocked parser+LLM. Guards the Mastermind enforcement layer
      # against silent bit-rot (the eval harnesses in scripts/eval/ are
      # manual/API-billed and can't run here; this is the free floor).
      - name: Validator gate (deterministic fixtures)
        run: npx tsx scripts/mastermind/validator-gate-dryrun.ts

      # Contract-fidelity smoke (PR-CI-2) — builds CoachContracts for the 10
      # vendored fixtures and asserts the referee checks catch canned
      # fabrications with zero false fires on the clean control. No network;
      # the live BEFORE/AFTER baseline runs stay manual (API-billed).
      - name: Contract fidelity smoke (--dry-run, no network)
        run: npx tsx scripts/eval/contract_fidelity_eval.ts --dry-run

      # Vercel-parity gate. Vercel runs `next build` (which runs eslint with
      # error-level rules) — CI didn't, so lint errors could pass CI, get
      # merged, and silently freeze every prod deploy (happened 2026-08-10,
      # citations.ts no-useless-escape, prod frozen ~a day). Verified to pass
      # with no .env file present.
      - name: Production build (Vercel parity)
        run: npm run build

      # Critical-journey E2E against the production build we just made.
      # Secrets-free by design: journeys are client-side (dark chrome, auth
      # dialog, COPPA DOB gate, core pages) and never create accounts.
      # `--with-deps` shells out to apt-get, and apt is what hung on
      # 2026-08-19 — every stuck run in the repo was parked on this one step.
      # Two changes, both about failing fast rather than hanging:
      #
      #   1. a step budget, so a wedged install dies in 6 minutes;
      #   2. a fallback to the browser-only install. ubuntu-latest already
      #      ships Chromium's shared libraries, so the deps pass is
      #      belt-and-braces; when apt is unreachable, skipping it still
      #      produces a working browser rather than a red pipeline.
      #
      # `timeout` (coreutils) bounds the inner command so the `||` can fire —
      # step-level `timeout-minutes` would kill the whole step instead.
      - name: Install Playwright browser
        timeout-minutes: 6
        run: |
          timeout 240 npx playwright install --with-deps chromium \
            || npx playwright install chromium

      # Separate budget: if the suite itself hangs (a webServer that never
      # comes up, a test awaiting a locator forever), that is a different
      # failure from a broken install and should be legible as one.
      #
      # 20, raised from 12 when the course specs took the suite past it. NOT a
      # sign the budget was wrong before: the suite runs at 2 workers because
      # more was measured to be slower AND to produce false reds, and it is now
      # genuinely ~14 minutes locally across both projects — the run that hit
      # the old ceiling had passed 343 tests and failed none. The budget is here
      # to catch a HANG, so it wants headroom over the honest runtime, not a
      # number the suite is about to grow into again.
      - name: E2E critical journeys
        timeout-minutes: 20
        run: npx playwright test --project=local-desktop-light --project=local-mobile-light
