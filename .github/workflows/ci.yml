name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:

# Stop paying for runs nobody will read.
#
# Without this, pushing a follow-up commit to a PR leaves the previous run
# going to completion — a full 8.6-minute pipeline (install, tsc, 2622 unit
# tests, validator gate, contract smoke, production build, Playwright on two
# projects) whose result is superseded before it finishes. A PR with three
# review iterations burned four runs to learn one answer.
#
# This repo is private, so those minutes come out of a monthly allowance, and
# CI was ~79% of it: 165 runs at ~8.6 min = ~1,423 of ~1,796 minutes used in
# the first twelve days of August 2026 — enough to exhaust the 2,000-minute
# quota mid-month and have GitHub refuse to start any further job.
#
# Grouping:
#   • pull_request  → keyed by PR number, so a new push cancels the old run.
#   • push (main)   → keyed by SHA, which is unique per commit, so main runs
#     neither cancel each other nor queue behind one another. Every commit
#     that lands still gets verified in full — the point is to drop answers
#     nobody is waiting for, not to skip verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Deterministic validator gate — 22 known-good/known-bad fixtures, no
      # network, mocked parser+LLM. Guards the Mastermind enforcement layer
      # against silent bit-rot (the eval harnesses in scripts/eval/ are
      # manual/API-billed and can't run here; this is the free floor).
      - name: Validator gate (deterministic fixtures)
        run: npx tsx scripts/mastermind/validator-gate-dryrun.ts

      # Contract-fidelity smoke (PR-CI-2) — builds CoachContracts for the 10
      # vendored fixtures and asserts the referee checks catch canned
      # fabrications with zero false fires on the clean control. No network;
      # the live BEFORE/AFTER baseline runs stay manual (API-billed).
      - name: Contract fidelity smoke (--dry-run, no network)
        run: npx tsx scripts/eval/contract_fidelity_eval.ts --dry-run

      # Vercel-parity gate. Vercel runs `next build` (which runs eslint with
      # error-level rules) — CI didn't, so lint errors could pass CI, get
      # merged, and silently freeze every prod deploy (happened 2026-08-10,
      # citations.ts no-useless-escape, prod frozen ~a day). Verified to pass
      # with no .env file present.
      - name: Production build (Vercel parity)
        run: npm run build

      # Critical-journey E2E against the production build we just made.
      # Secrets-free by design: journeys are client-side (dark chrome, auth
      # dialog, COPPA DOB gate, core pages) and never create accounts.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E critical journeys
        run: npx playwright test --project=local-desktop-light --project=local-mobile-light
