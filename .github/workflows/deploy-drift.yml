# Deploy drift watch.
#
# `deploy-verify.yml` catches "the Vercel build failed" — but it triggers on
# `push: branches: [main]`, so it is structurally blind to the case where the
# PUSH EVENT ITSELF never arrives. That is not hypothetical: on 2026-08-14 a
# GitHub 502 during a merge completed the merge server-side but delivered no
# push event. No Vercel build ran, deploy-verify never ran, and prod sat frozen
# with nothing alerting — the exact outcome deploy-verify exists to prevent,
# reached through the one door it cannot see.
#
# This runs on a TIMER instead, so it depends on nothing that can go missing:
# compare what prod is serving against main's real HEAD, and shout if prod is
# behind by more than a deploy's worth of time.
name: Deploy drift

on:
  schedule:
    # Every 30 minutes, matching the heartbeat cadence.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare prod against main HEAD
        id: drift
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          PROD_SHA=$(curl -sf --max-time 15 https://www.chessmasti.com/api/version \
            | sed -E 's/.*"sha":"([^"]+)".*/\1/') || PROD_SHA=""

          echo "main:  $HEAD_SHA"
          echo "prod:  ${PROD_SHA:-unreachable}"

          if [ -z "$PROD_SHA" ]; then
            echo "::warning::/api/version unreachable — cannot assess drift this run."
            exit 0
          fi

          # "dev" means a deployment was made outside the git integration (a
          # CLI upload), so VERCEL_GIT_COMMIT_SHA was never injected. Prod may
          # well be current, but nothing can verify it — which is its own
          # failure, because every deploy check downstream is now blind.
          if [ "$PROD_SHA" = "dev" ]; then
            echo "reason=Prod reports sha \"dev\": it was deployed outside the git integration, so deploy verification is blind." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PROD_SHA" = "$HEAD_SHA" ]; then
            echo "In sync."
            exit 0
          fi

          if ! git cat-file -e "$PROD_SHA" 2>/dev/null; then
            echo "reason=Prod is serving $PROD_SHA, which does not exist in this repository." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Grace period: a deploy legitimately takes a few minutes, so only
          # complain once main's HEAD has been sitting undeployed for a while.
          HEAD_AGE=$(( $(date +%s) - $(git log -1 --format=%ct HEAD) ))
          BEHIND=$(git rev-list --count "$PROD_SHA..HEAD")
          echo "prod is $BEHIND commit(s) behind; HEAD is ${HEAD_AGE}s old"

          if [ "$HEAD_AGE" -gt 2400 ]; then
            echo "reason=Prod is $BEHIND commit(s) behind main. HEAD $HEAD_SHA has been undeployed for $((HEAD_AGE/60)) minutes." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: File an issue when prod has drifted
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.drift.outputs.reason }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title Prod has drifted from main" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Issue already open — not filing a duplicate."
            exit 0
          fi
          BODY=$(printf '%s\n' \
            "$REASON" \
            "" \
            "This check runs on a timer rather than on \`push\`, so it catches the case \`deploy-verify\` cannot: a push event that was never delivered at all (GitHub 502 during a merge, a dropped webhook), where no build runs and no verification fires." \
            "" \
            "Likely fixes:" \
            "- Push an empty commit to main to regenerate the push event." \
            "- Check the Vercel dashboard for a failed or missing production build." \
            "" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🚨 Prod has drifted from main" \
            --body "$BODY"
