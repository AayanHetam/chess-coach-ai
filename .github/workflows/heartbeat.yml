# Production heartbeat (usability-detection program, 2026-08-10).
#
# Hourly, probe the endpoints that must never break — the paths
# whose silent failure has already cost us (signup dead 3 months; deploys
# frozen a day; homepage white). On any failure, file a GitHub issue
# (deduplicated) so a human is alerted within minutes, not months.
#
# Cadence is hourly rather than half-hourly: GitHub bills a minimum of one
# minute per job and this repo is private, so the probe alone was consuming
# ~644 metered minutes a month against a 2,000-minute allowance.
#
# All probes are read-only: bad-credential signin, redirect handoffs,
# version/health endpoints. Nothing is created or mutated.
#
# DRIFT CHECK (folded in 2026-08-14, was its own deploy-drift.yml). That
# workflow ran on its own */30 schedule, which at one billed minute per run
# would have added back roughly the ~322 minutes a month the cadence cut above
# had just saved. The check itself is two API calls and a curl — it does not
# deserve a job of its own, and riding the heartbeat means the one scheduled
# run GitHub actually delivers performs both checks instead of them being
# throttled independently.
name: Heartbeat

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  # `contents: read` is load-bearing for the drift step, which reads main's
  # HEAD and the compare endpoint. Naming any permission sets every unlisted
  # scope to none, so omitting it does not fall back to a default — the API
  # calls fail, the step takes its "cannot assess drift" branch and exits 0,
  # and the check goes quietly dead while still reporting success.
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        run: |
          set -u
          BASE="https://www.chessmasti.com"
          FAILS=""

          check() { # name, expected, actual
            if [ "$2" != "$3" ]; then
              echo "::error::$1 — expected '$2', got '$3'"
              FAILS="$FAILS\n- **$1**: expected \`$2\`, got \`$3\`"
            else
              echo "ok: $1"
            fi
          }

          # 1. Version endpoint answers with a SHA
          V=$(curl -sf --max-time 15 "$BASE/api/version" | grep -oc '"sha":"[a-f0-9]\{40\}"' || echo 0)
          check "api/version serves a SHA" "1" "$V"

          # 2. Landing renders with the hero copy (dark chrome regression canary)
          H=$(curl -sf --max-time 20 "$BASE/" | grep -oci "chess coaching" || echo 0)
          check "landing contains hero copy" "yes" "$([ "$H" -ge 1 ] && echo yes || echo no)"

          # 3. Signin path is alive (bad creds must return 401, not 5xx) AND
          # still answers with a generic rejection. The status alone was not
          # enough: PR #332 changed the copy to "Invalid handle, email or
          # password." and every probe stayed green, because nothing looked at
          # the body. The wording is deliberately loose — what must hold is
          # that ONE generic message comes back, never "no such account",
          # which would turn the form into an enumeration oracle.
          SBODY=$(curl -s --max-time 20 -w '\n%{http_code}' -X POST "$BASE/api/auth/signin" \
            -H "Content-Type: application/json" \
            -d '{"email":"heartbeat-probe@example.com","password":"definitely-wrong-1!"}')
          S=$(printf '%s' "$SBODY" | tail -n1)
          check "signin returns 401 for bad creds" "401" "$S"
          # No `|| echo 0` here: grep -c ALWAYS prints a count, so the
          # fallback appends a second line and the failure text reads
          # "expected '1', got '0\n0'". The script runs under `set -u`, not
          # `set -e`, so grep's exit status is harmless on its own.
          SMSG=$(printf '%s' "$SBODY" | grep -ci "invalid.*password")
          check "signin rejects generically" "1" "$SMSG"

          # 4. Google OAuth start hands off to Google
          L=$(curl -s -o /dev/null -D - --max-time 15 "$BASE/api/auth/google/start?returnTo=/" \
            | grep -ci "^location: https://accounts.google.com" || echo 0)
          check "google/start redirects to Google" "1" "$L"

          # 5. Signup API is alive and enforcing the age affirmation.
          #
          # Wording-tolerant, and NOT by preference: this probe grepped for
          # "date of birth" and #341 replaced the DOB screen with a 13+
          # checkbox, changing the copy. The heartbeat then failed every hour
          # against a perfectly healthy site and filed issue #344. I was
          # editing this very file the same day to fix the identical staleness
          # in the signin probe and did not check this one.
          #
          # What must hold is that the age affirmation is ENFORCED, not the
          # sentence it is enforced with. Same pattern prod-smoke settled on.
          #
          # `handle` is sent so this isolates the AGE gate: handles became
          # required at signup in #343, and without one the first error
          # reported could be about the handle instead.
          G=$(curl -s --max-time 20 -X POST "$BASE/api/auth/signup" \
            -H "Content-Type: application/json" \
            -d '{"email":"heartbeat-probe@example.com","password":"Longenough1!pass","handle":"heartbeatprobe"}' \
            | grep -ci "confirm.*to sign up")
          check "signup enforces age affirmation" "1" "$G"

          # 6. Env config complete (names-only presence check)
          C=$(curl -s --max-time 15 "$BASE/api/health/config" | grep -c '"ok":true' || echo 0)
          check "health/config reports ok" "1" "$C"

          if [ -n "$FAILS" ]; then
            printf "%b" "$FAILS" > /tmp/fails.md
            exit 1
          fi

      # `deploy-verify` triggers on `push: branches: [main]`, so it is
      # structurally blind to the case where the PUSH EVENT ITSELF never
      # arrives. Not hypothetical: on 2026-08-14 a GitHub 502 during a merge
      # completed the merge server-side but delivered no push event. No Vercel
      # build ran, deploy-verify never ran, and prod sat frozen with nothing
      # alerting — the exact outcome deploy-verify exists to prevent, reached
      # through the one door it cannot see.
      #
      # This rides the heartbeat's timer instead, so it depends on nothing that
      # can go missing. `always()` so a failing probe above does not mask it —
      # a broken prod is when drift matters most. It never exits non-zero
      # itself; it reports through `drifted` so the two alarms stay separate
      # and one cannot be mistaken for the other.
      #
      # Comparison is done over the API rather than `actions/checkout`: this
      # repo carries 682MB of history, and cloning it hourly to answer "is
      # prod's SHA an ancestor of main" would cost more than the check.
      - name: Compare prod against main HEAD
        id: drift
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PROD_SHA=$(curl -sf --max-time 15 https://www.chessmasti.com/api/version \
            | sed -E 's/.*"sha":"([^"]+)".*/\1/') || PROD_SHA=""

          if [ -z "$PROD_SHA" ]; then
            echo "::warning::/api/version unreachable — cannot assess drift this run."
            exit 0
          fi

          MAIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" 2>/dev/null) || MAIN=""
          if [ -z "$MAIN" ]; then
            echo "::warning::could not read main's HEAD — cannot assess drift this run."
            exit 0
          fi
          HEAD_SHA=$(printf '%s' "$MAIN" | jq -r .sha)
          HEAD_DATE=$(printf '%s' "$MAIN" | jq -r .commit.committer.date)

          echo "main:  $HEAD_SHA"
          echo "prod:  $PROD_SHA"

          # "dev" means a deployment was made outside the git integration (a
          # CLI upload), so VERCEL_GIT_COMMIT_SHA was never injected. Prod may
          # well be current, but nothing can verify it — which is its own
          # failure, because every deploy check downstream is now blind.
          # Checked explicitly rather than left to fall through to the
          # unknown-SHA branch below: that branch would still fire, but would
          # report the wrong reason, sending whoever reads the issue after a
          # phantom commit instead of a CLI deploy.
          if [ "$PROD_SHA" = "dev" ]; then
            echo "reason=Prod reports sha \"dev\": it was deployed outside the git integration, so deploy verification is blind." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PROD_SHA" = "$HEAD_SHA" ]; then
            echo "In sync."
            exit 0
          fi

          BEHIND=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PROD_SHA...$HEAD_SHA" --jq .ahead_by 2>/dev/null) || BEHIND=""
          if [ -z "$BEHIND" ]; then
            echo "reason=Prod is serving $PROD_SHA, which does not exist in this repository." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Grace period: a deploy legitimately takes a few minutes, so only
          # complain once main's HEAD has been sitting undeployed for a while.
          HEAD_AGE=$(( $(date +%s) - $(date -d "$HEAD_DATE" +%s) ))
          echo "prod is $BEHIND commit(s) behind; HEAD is ${HEAD_AGE}s old"

          if [ "$HEAD_AGE" -gt 2400 ]; then
            echo "reason=Prod is $BEHIND commit(s) behind main. HEAD $HEAD_SHA has been undeployed for $((HEAD_AGE/60)) minutes." >> "$GITHUB_OUTPUT"
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: File an issue when prod has drifted
        if: always() && steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.drift.outputs.reason }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title Prod has drifted from main" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Issue already open — not filing a duplicate."
            exit 0
          fi
          BODY=$(printf '%s\n' \
            "$REASON" \
            "" \
            "This check runs on the heartbeat's timer rather than on \`push\`, so it catches the case \`deploy-verify\` cannot: a push event that was never delivered at all (GitHub 502 during a merge, a dropped webhook), where no build runs and no verification fires." \
            "" \
            "Likely fixes:" \
            "- Push an empty commit to main to regenerate the push event." \
            "- Check the Vercel dashboard for a failed or missing production build." \
            "" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🚨 Prod has drifted from main" \
            --body "$BODY"

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title Heartbeat failing" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            BODY=$(printf '%s\n' \
              "Production heartbeat detected failures on https://www.chessmasti.com:" \
              "" \
              "$(cat /tmp/fails.md 2>/dev/null || echo '(probe step crashed before recording details)')" \
              "" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "This fires every 30 min; close the issue once prod is healthy again.")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🚨 Heartbeat failing — production probe errors" \
              --body "$BODY"
          else
            echo "Open heartbeat issue already exists; not duplicating."
          fi
