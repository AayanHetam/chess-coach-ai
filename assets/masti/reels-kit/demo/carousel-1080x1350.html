<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masti carousel demo</title>
<link rel="stylesheet" href="../overlay/masti-overlay.css">
<style>
  html, body { margin: 0; background: #0D1420; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0D1420; color: #F2E7DA; font-family: system-ui, sans-serif; }
  .title { position: absolute; left: 72px; top: 120px; width: 700px; font-size: 84px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 72px; top: 520px; width: 620px; font-size: 40px; line-height: 1.35; color: rgba(242,231,218,0.8); }
  .ember { color: #F97316; }
  .brand { position: absolute; left: 72px; bottom: 72px; font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(242,231,218,0.55); }
</style>
</head>
<body>
<div class="slide">
  <div class="title">The Vienna: <span class="ember">one idea</span> beats memorising ten lines.</div>
  <div class="sub">Swipe for the five moves that make it work, verified by Stockfish.</div>
  <!-- Hook slide: Masti has the idea, bottom-right, opposite the title. -->
  <img class="masti-still" src="../stills/idea.png" width="360" height="450" alt="" style="right: 56px; bottom: 56px;">
  <div class="brand">chessmasti.com</div>
</div>
</body>
</html>
