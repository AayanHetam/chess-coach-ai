<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="grad" cx="50%" cy="25%" r="70%" gradientUnits="userSpaceOnUse"
      fx="250" fy="120" x1="0" y1="0" x2="500" y2="500">
      <stop offset="0%"   stop-color="#FFE566"/>
      <stop offset="25%"  stop-color="#FFBB33"/>
      <stop offset="60%"  stop-color="#FF8C1A"/>
      <stop offset="100%" stop-color="#E05500"/>
    </radialGradient>
  </defs>

  <!--
    M shape using even-odd fill rule:
    - Outer path: the full rounded M silhouette (clockwise)
    - Left hole: left arch inner cutout (counter-clockwise → punches hole)
    - Right hole: right arch inner cutout (counter-clockwise → punches hole)
    Result: transparent holes inside the M arches, background shows through.
    The chess king sits in the V valley between the two arches.
  -->

  <!-- ═══ M BODY (even-odd) ═══ -->
  <path fill="url(#grad)" fill-rule="evenodd" d="
    M 250,420
    C 185,400 70,355 48,240
    C 28,135 90,52 175,45
    C 218,41 248,72 250,118
    C 252,72 282,41 325,45
    C 410,52 472,135 452,240
    C 430,355 315,400 250,420 Z

    M 250,355
    C 228,330 155,308 138,235
    C 123,170 155,112 198,108
    C 225,105 247,132 250,170
    C 253,132 275,105 302,108
    C 345,112 377,170 362,235
    C 345,308 272,330 250,355 Z
  "/>

  <!-- ═══ CHESS KING in the V notch ═══ -->
  <!-- King sits in the V valley, positioned to be clearly visible -->
  <g transform="translate(250,340)">
    <!-- King base -->
    <rect x="-36" y="48" width="72" height="12" rx="4" fill="#FFD44A"/>
    <!-- King body lower (wide) -->
    <path d="M -30,20 C -32,35 -36,48 -36,48 L 36,48 C 36,48 32,35 30,20 Z" fill="#FFD44A"/>
    <!-- King body upper (narrow) -->
    <rect x="-14" y="6" width="28" height="16" rx="3" fill="#FFD44A"/>
    <!-- Cross horizontal bar -->
    <rect x="-22" y="-4" width="44" height="10" rx="3" fill="#FFD44A"/>
    <!-- Cross vertical bar -->
    <rect x="-6" y="-18" width="12" height="24" rx="3" fill="#FFD44A"/>
    <!-- Crown orbs -->
    <circle cx="-22" cy="-4" r="6" fill="#FFD44A"/>
    <circle cx="0"   cy="-8" r="6" fill="#FFD44A"/>
    <circle cx="22"  cy="-4" r="6" fill="#FFD44A"/>
  </g>

</svg>
