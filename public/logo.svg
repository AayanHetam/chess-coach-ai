<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460">
  <defs>
    <!-- Main orange gradient matching the logo: bright gold center → deep orange edges -->
    <radialGradient id="g1" cx="50%" cy="30%" r="65%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="30%"  stop-color="#FFAA33"/>
      <stop offset="70%"  stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E05000"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="20%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFD966"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </radialGradient>
    <!-- Clip path so king is only visible inside the M -->
    <clipPath id="mClip">
      <path d="
        M 250,50
        C 195,50 140,80 115,135
        C 90,190 100,255 130,300
        C 155,338 200,360 250,375
        C 300,360 345,338 370,300
        C 400,255 410,190 385,135
        C 360,80 305,50 250,50 Z
      "/>
    </clipPath>
  </defs>

  <!--
    The M logo is two thick rounded arches joined at a central V notch.
    Outer shape = big rounded rectangle / oval
    Inner cutout = two teardrop holes (left arch inner, right arch inner)
    Central V = the valley between the two humps
  -->

  <!-- ── OUTER M BODY ── -->
  <!-- Left hump outer -->
  <path fill="url(#g1)" d="
    M 250 390
    C 195 375, 95 340, 65 245
    C 38 158, 88 68, 168 55
    C 208 48, 242 75, 250 115
    C 258 75, 292 48, 332 55
    C 412 68, 462 158, 435 245
    C 405 340, 305 375, 250 390 Z
  "/>

  <!-- ── LEFT INNER CUTOUT (left arch hole) ── -->
  <path fill="black" d="
    M 250 340
    C 232 318, 165 295, 148 228
    C 134 170, 162 118, 200 112
    C 224 108, 244 130, 250 162
    C 256 130, 276 108, 300 112
    C 338 118, 366 170, 352 228
    C 335 295, 268 318, 250 340 Z
  "/>

  <!-- ── CENTRAL V BRIDGE (re-fills the valley between humps) ── -->
  <!-- This is the orange area that forms the bottom of the M between the two arches -->
  <path fill="url(#g1)" d="
    M 215 230
    C 228 270, 240 305, 250 330
    C 260 305, 272 270, 285 230
    L 265 230
    C 258 258, 252 285, 250 305
    C 248 285, 242 258, 235 230 Z
  "/>

  <!-- ── CHESS KING (golden silhouette in the V notch) ── -->
  <g transform="translate(250,298) scale(0.38)" fill="url(#g2)">
    <!-- Pedestal / base -->
    <rect x="-44" y="95"  width="88" height="16" rx="5"/>
    <!-- Lower body (wide) -->
    <path d="M -34,55 Q -38,95 -44,95 L 44,95 Q 38,95 34,55 Z"/>
    <!-- Upper body (narrower) -->
    <rect x="-18" y="22" width="36" height="36" rx="4"/>
    <!-- Cross horizontal bar -->
    <rect x="-26" y="6"  width="52" height="14" rx="5"/>
    <!-- Cross vertical bar -->
    <rect x="-8"  y="-14" width="16" height="34" rx="5"/>
    <!-- Crown orbs -->
    <circle cx="-26" cy="6"  r="8"/>
    <circle cx="0"   cy="-2" r="8"/>
    <circle cx="26"  cy="6"  r="8"/>
  </g>

</svg>
